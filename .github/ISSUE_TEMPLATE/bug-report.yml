name: Bug report
description: Report a reproducible problem in WP Term Images.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: WP Term Images version
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: input
    id: taxonomy
    attributes:
      label: Affected taxonomy
      description: Include the taxonomy name and the plugin that registered it, if any.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs and relevant query arguments. Never include credentials or private media.
